name: Release

# One-click release: pick the package, the bump type, type the changelog line,
# run. The job creates a changeset from those inputs, versions + generates the
# changelog, commits the bump back to main, then builds and publishes to npm.
#
# A run releases the chosen package *and* anything else with a pending
# changeset or a forced dependent bump — gissen-mcp pins gissen exactly
# (`workspace:*`), so a gissen release always carries gissen-mcp with it.
on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to release
        type: choice
        required: true
        options:
          - gissen
          - gissen-mcp
      bump:
        description: Release type
        type: choice
        required: true
        options:
          - patch
          - minor
          - major
      summary:
        description: Changelog entry — what changed in this release
        type: string
        required: true

concurrency: ${{ github.workflow }}

permissions:
  contents: write # commit the version bump + push tags back to main
  id-token: write # npm provenance (OIDC)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create changeset from inputs
        env:
          PACKAGE: ${{ inputs.package }}
          BUMP: ${{ inputs.bump }}
          SUMMARY: ${{ inputs.summary }}
        run: |
          cat > ".changeset/release-${{ github.run_id }}.md" <<EOF
          ---
          "${PACKAGE}": ${BUMP}
          ---

          ${SUMMARY}
          EOF

      - name: Version (bump + changelog)
        run: pnpm changeset version

      - name: Commit version bump
        run: |
          git add -A
          git commit -m "release: version ${{ inputs.package }} (${{ inputs.bump }})"

      - name: Build + publish to npm
        run: pnpm release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'

      # In pre mode changesets publishes to the `alpha` dist-tag and won't touch
      # `latest`. Its one exception — publish to `latest` when every published
      # version is a prerelease — does not apply to either package: gissen has a
      # stable 0.0.1 and gissen-mcp a placeholder 0.0.0 on npm, so both read as
      # "already had a regular release". Without this step `latest` would stay
      # pinned to those ancient versions, and a bare `npm install gissen` or
      # `npx gissen-mcp` would resolve to them.
      #
      # Re-pointing `latest` at a version that is already `latest` is a
      # successful no-op, so this runs unconditionally for both packages —
      # whichever one this release actually bumped. Harmless once we exit pre
      # mode. create-gissen-app is excluded: still an unreleased placeholder.
      - name: Point latest at the released versions
        run: |
          for dir in packages/core packages/mcp; do
            NAME=$(node -p "require('./$dir/package.json').name")
            VERSION=$(node -p "require('./$dir/package.json').version")
            echo "dist-tag add $NAME@$VERSION latest"
            npm dist-tag add "$NAME@$VERSION" latest
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Push commit + tags
        run: git push --follow-tags
