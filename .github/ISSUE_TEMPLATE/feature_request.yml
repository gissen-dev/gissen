name: Feature request / proposal
description: Suggest an idea, an API, or an improvement
title: '[Proposal]: '
labels: [Enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! For larger changes — especially anything touching
        `packages/core` (the editor, config API, or public types) — it's best to
        open a proposal like this (or a Discussion) before writing code, so we can
        align on the approach.
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What problem does this solve? What are you trying to do?
      placeholder: As someone building pages with Gissen, I can't ...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see? A sketch of the API/UX is great.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about, and why you set them aside.
    validations:
      required: false
  - type: dropdown
    id: scope
    attributes:
      label: Does this touch core?
      description: Best-guess. Core changes get a careful review round.
      options:
        - No — docs / example / tests / tooling
        - Maybe — not sure
        - Yes — editor component / config API / public types
    validations:
      required: false
